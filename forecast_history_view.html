const metricSelect = document.getElementById('metricSelect');
const slotSelect = document.getElementById('slotSelect');
const summary = document.getElementById('summary');

function tsToIso(ts) { return new Date(ts * 1000).toISOString().replace('.000Z','Z'); }

for (const [id, meta] of Object.entries(DATA.metrics)) {
  const opt = document.createElement('option');
  opt.value = id;
  opt.textContent = `${meta.name} (${meta.unit})`;
  metricSelect.appendChild(opt);
}

function fillSlots() {
  slotSelect.innerHTML = '';
  const metric = metricSelect.value;
  const slots = DATA.slots_by_metric[metric] || [];
  for (const ts of slots) {
    const opt = document.createElement('option');
    opt.value = String(ts);
    opt.textContent = tsToIso(ts);
    slotSelect.appendChild(opt);
  }
  if (slotSelect.options.length > 0) {
    slotSelect.selectedIndex = Math.max(0, slotSelect.options.length - 1);
  }
}

const predCtx = document.getElementById('predChart').getContext('2d');
const errCtx = document.getElementById('errChart').getContext('2d');

const predChart = new Chart(predCtx, {
  type: 'line',
  data: { labels: [], datasets: [] },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    interaction: { mode: 'index', intersect: false },
    scales: {
      x: { ticks: { color: '#54615a' }, grid: { color: '#d6ddd8' } },
      y: { ticks: { color: '#54615a' }, grid: { color: '#d6ddd8' } }
    },
    plugins: { legend: { labels: { color: '#152018' } } }
  }
});

const errChart = new Chart(errCtx, {
  type: 'line',
  data: { labels: [], datasets: [] },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    interaction: { mode: 'index', intersect: false },
    scales: {
      x: { ticks: { color: '#54615a' }, grid: { color: '#d6ddd8' } },
      y: { ticks: { color: '#54615a' }, grid: { color: '#d6ddd8' }, title: { display: true, text: 'Absolute Error', color: '#54615a' } }
    },
    plugins: { legend: { labels: { color: '#152018' } } }
  }
});

function render() {
  const metric = metricSelect.value;
  const slot = slotSelect.value;
  const key = `${metric}|${slot}`;
  const points = (DATA.forecast_series[key] || []).slice().sort((a,b)=>a.ingested-b.ingested);
  const meta = DATA.metrics[metric];
  const observed = DATA.observed[key];

  const labels = points.map(p => tsToIso(p.ingested));
  const values = points.map(p => p.value);

  const predDatasets = [{
    label: 'Forecast snapshots',
    data: values,
    borderColor: '#1f7a4d',
    backgroundColor: 'rgba(31,122,77,0.15)',
    tension: 0.15,
    pointRadius: 3
  }];

  if (Number.isFinite(observed)) {
    predDatasets.push({
      label: 'Observed value',
      data: new Array(values.length).fill(observed),
      borderColor: '#c95a1a',
      borderDash: [6,4],
      pointRadius: 0,
      tension: 0
    });
  }

  predChart.data.labels = labels;
  predChart.data.datasets = predDatasets;
  predChart.options.scales.y.title = { display: true, text: `Value (${meta.unit})`, color: '#54615a' };
  predChart.update();

  if (Number.isFinite(observed)) {
    const absErr = values.map(v => Math.abs(v - observed));
    errChart.data.labels = labels;
    errChart.data.datasets = [{
      label: 'Absolute error |forecast - observed|',
      data: absErr,
      borderColor: '#a33a3a',
      backgroundColor: 'rgba(163,58,58,0.15)',
      tension: 0.15,
      pointRadius: 3
    }];
    const mae = absErr.length ? absErr.reduce((a,b)=>a+b,0)/absErr.length : NaN;
    summary.textContent = `Target slot: ${tsToIso(Number(slot))} | snapshots: ${points.length} | observed: ${observed.toFixed(3)} ${meta.unit} | MAE: ${Number.isFinite(mae) ? mae.toFixed(3) : 'n/a'}`;
  } else {
    errChart.data.labels = labels;
    errChart.data.datasets = [{
      label: 'Absolute error unavailable (no observed for this slot)',
      data: labels.map(_=>null),
      borderColor: '#999',
      pointRadius: 0
    }];
    summary.textContent = `Target slot: ${tsToIso(Number(slot))} | snapshots: ${points.length} | observed: not available yet`;
  }
  errChart.update();
}

metricSelect.addEventListener('change', () => { fillSlots(); render(); });
slotSelect.addEventListener('change', render);

fillSlots();
render();
</script>
